;;; Kindle Launchpad configuration for kindle-myts (myts-ng)
;;; Place this file in /mnt/us/launchpad/myts.ini (or /mnt/us/launchpad/myts.l.ini) on the Kindle.
;;;
;;; Key Sequences:
;;;   Shift + T, then T: Launch myts-ng terminal (Session 1)
;;;   Shift + T, then Y: Launch myts-ng terminal (Session 2)
;;;   Shift + T, then U: Launch myts-ng terminal (Session 3)
;;;   Shift + T, then A: Terminate active myts sessions

[Actions]
T T = !/mnt/us/myts/myts &
T Y = !/mnt/us/myts/myts &
T U = !/mnt/us/myts/myts &
T A = !killall myts-ng myts-ng-kindle myts-ng-kindle-dbg myts 2>/dev/null; /etc/init.d/framework start >/dev/null 2>&1; /etc/init.d/pmond start >/dev/null 2>&1 &
